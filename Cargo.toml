[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
zdiff-core = { path = "crates/core" }
zdiff-highlight = { path = "crates/highlight" }
nucleo-matcher = "0.3.1"
zdiff-search = { path = "crates/search" }
regex = "1"
globset = "0.4"
gix = { version = "0.88.0", default-features = false }
tempfile = "3"
memchr = "2.8.3"
notify = "8.2"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
