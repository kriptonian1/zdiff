[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
zdiff-core = { path = "crates/core" }
zdiff-highlight = { path = "crates/highlight" }
nucleo-matcher = "0.3.1"
zdiff-search = { path = "crates/search" }
regex = "1"
globset = "0.4"
gix = { version = "0.88.0", default-features = false }
tempfile = "3"
memchr = "2.8.3"
notify = "8.2"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ratatui-textarea = { version = "0.9", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false }
ratatui-image = { version = "11.1", default-features = false }
resvg = { version = "0.48", default-features = false }
flate2 = "1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

# File:line in backtraces; ~15% faster clean builds than full debug info.
[profile.dev]
debug = "line-tables-only"

# Local `--release`: thin LTO keeps rebuilds near 20 s instead of 90 s.
[profile.release]
lto = "thin"
panic = "abort"
strip = true

# What the release workflow ships: slower to build, smaller and faster.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
